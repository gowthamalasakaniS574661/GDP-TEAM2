<!DOCTYPE html>
<html>
<head>
    <title>Comprehensive framework for pre-trained machine learning algorithms plant disease detector</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        textarea { width: 400px; height: 100px; }
        button { margin-top: 10px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>Comprehensive framework for pre-trained machine learning algorithms plant disease detector</h1>
    <form action="/predict" method="post">
        <textarea name="text" placeholder="Enter crop description or symptom"></textarea><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
