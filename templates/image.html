<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-Based Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #03031a; --bg2: #071124;
            --accent: #6ef0c3; --accent2: #5a8bff;
            --text: #e6f7ff; --muted: #9fbfaa;
            --success: #caffdf; --danger: #ff6b6b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, var(--bg1), var(--bg2));
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.08); }
        h1 { font-size: 32px; }
        .panel {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 20px;
        }
        .upload-area {
            border: 2px dashed rgba(110,240,195,0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(110,240,195,0.05);
        }
        .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(110,240,195,0.1);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        input[type="file"] {
            display: none;
        }
        .preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .preview.show {
            display: block;
        }
        .btn {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: #042e1a;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            background: rgba(110,240,195,0.05);
            border: 1px solid rgba(110,240,195,0.2);
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        .result.show { display: block; }
        .result h3 {
            color: var(--success);
            margin-bottom: 15px;
            font-size: 20px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .result-item:last-child { border-bottom: none; }
        .result-label { color: var(--muted); }
        .result-value { font-weight: 600; color: var(--text); }
        .confidence-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.5s ease;
        }
        .error {
            background: rgba(255,107,107,0.1);
            border: 1px solid rgba(255,107,107,0.3);
            color: var(--danger);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .error.show { display: block; }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.show { display: block; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ Image-Based Prediction</h1>
            <a href="/" class="back-btn">← Back to Home</a>
        </div>
        
        <div class="panel">
            <label for="model">Select Model (5 Available)</label>
            <select id="model">
                <option value="">Loading models...</option>
            </select>
            
            <label>Upload Plant Leaf Image</label>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📷</div>
                <p>Click to upload or drag and drop</p>
                <p style="font-size: 12px; color: var(--muted); margin-top: 5px;">Supports: JPG, PNG (Max 10MB)</p>
                <img class="preview" id="preview">
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            
            <button class="btn" onclick="predict()" id="predictBtn">Predict Disease</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing image...</p>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="result" id="result">
                <h3>✅ Prediction Result</h3>
                <div class="result-item">
                    <span class="result-label">Disease:</span>
                    <span class="result-value" id="prediction">-</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Confidence:</span>
                    <span class="result-value" id="confidence">-</span>
                </div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
                <div class="result-item">
                    <span class="result-label">Model Used:</span>
                    <span class="result-value" id="modelUsed">-</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let selectedFile = null;
        
        // Load models on page load
        fetch('/api/image_models')
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById('model');
                select.innerHTML = '<option value="">-- Select a Model --</option>';
                data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.textContent = `${m.name} (${m.labels ? m.labels.length + ' classes' : 'Deep Learning'})`;
                    select.appendChild(opt);
                });
            })
            .catch(err => console.error('Error loading models:', err));
        
        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }
        
        function handleFile(file) {
            selectedFile = file;
            const preview = document.getElementById('preview');
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.add('show');
            };
            reader.readAsDataURL(file);
        }
        
        async function predict() {
            const model = document.getElementById('model').value;
            const btn = document.getElementById('predictBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            
            // Reset
            error.classList.remove('show');
            result.classList.remove('show');
            
            // Validation
            if (!model) {
                error.textContent = 'Please select a model';
                error.classList.add('show');
                return;
            }
            if (!selectedFile) {
                error.textContent = 'Please upload an image';
                error.classList.add('show');
                return;
            }
            
            // Show loading
            btn.disabled = true;
            loading.classList.add('show');
            
            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('model_name', model);
                
                const response = await fetch('/api/predict_image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('prediction').textContent = data.prediction;
                    document.getElementById('confidence').textContent = (data.confidence * 100).toFixed(2) + '%';
                    document.getElementById('confidenceFill').style.width = (data.confidence * 100) + '%';
                    document.getElementById('modelUsed').textContent = data.model;
                    result.classList.add('show');
                } else {
                    error.textContent = data.message || 'Prediction failed';
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.classList.add('show');
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
